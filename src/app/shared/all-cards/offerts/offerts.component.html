<div class="glide">
    <div class="glide__track" data-glide-el="track">
      <ul class="glide__slides">
        @for(d of offerts; track d.id ){

        <li class="glide__slide  ">
            <!-- <img [src]="urlFB+b.imgPromocion+'?alt=media'"  class="imgOferta shadow-xl rounded-lg"   alt=""> -->
                    <img [loading]="isLazyLoaded ? 'lazy' : 'eager'" [decoding]="isLazyLoaded ? 'async' : 'auto'"
          class="w-full 2xl:h-[32rem] xl:h-[23rem] object-cover  shadow-xl rounded-lg group-hover:scale-105 transition-transform duration-300 cursor-pointer"
          [src]="urlFB+d.imgPromocion+'?alt=media'" [alt]="d?.pro_nom || 'Producto'" [sizes]="getSizes()"
          (load)="onImageLoad($event)">

        @if (!imageLoadedState && !imageErrorState && isLazyLoaded) {
        <div class="absolute inset-0 bg-gray-100 flex items-center justify-center">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-orange-400"></div>
        </div>
        }
        </li>
        }

      </ul>
    </div>
  
    <div class="glide__arrows" data-glide-el="controls">
      <button class="glide__arrow glide__arrow--left" data-glide-dir="<"><i class="bi bi-caret-left-fill"></i></button>
      <button class="glide__arrow glide__arrow--right" data-glide-dir=">"><i class="bi bi-caret-right-fill"></i></button>
    </div>
  </div>
