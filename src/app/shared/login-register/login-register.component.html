

    <!-- Modal content -->
    <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
        <!-- Modal header -->
        <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
            @if(action=='login'){
                <h3 class="text-xl font-semibold h3Form ">
                    Inicio de Sesión
               </h3>
            }@else{
                <h3 class="text-xl font-semibold h3Form ">
                    Registrarse
               </h3>
            }
            <button type="button" class="end-2.5 white bg-gray-100 icoClose rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center " (click)="closeModal(true, '#modalLogin')">
                <svg class="w-3 h-3 " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                </svg>
                <span class="sr-only">Close modal</span>
            </button>
        </div>

        <!-- Modal body -->
        @if(action=='login'){
            <div class="p-4 md:p-5">
                <div class="flex justify-center align-items " >
                    <div class="inline-flex w-full max-w-xs  rounded-full border border-gray-300 bg-white mb-6" role="group" style="display: flex; justify-content: center; align-items: center; " >
                        <button 
                            [ngClass]="{ 'classCustom shadow-lg': flagSelectButton, 'bg-white text-gray-700 ': !flagSelectButton }" 
                            type="button" 
                            class="flex-1 rounded-full px-4 py-2.5 text-md font-medium transition-all duration-200 ease-in-out"
                            (click)="selectLoginDefault('user')">
                            Cliente
                        </button>
                        <button 
                            [ngClass]="{ 'classCustom': !flagSelectButton, 'bg-white text-gray-700': flagSelectButton }" 
                            type="button" 
                            class="flex-1 rounded-full px-4 py-2.5 text-md font-medium transition-all duration-200 ease-in-out"
                            (click)="selectLoginDefault('admin')">

                            Administrador
                        </button>
                    </div>
                </div>
    
                @if(flagSelectButton){
                    <form class="space-y-4 px-3" [formGroup]="formUser" >
                
                        <div class="pb-2">
                            <label for="email" class="labelGeneral">Cédula o RUC</label>
                            <input 
                            formControlName="usuario"  type="text" class="inputGeneral" placeholder="Ingrese cédula o RUC" required />
                        </div>
                        @if(!flagPassword){
                            <div>
                                <label for="password" class="labelGeneral z-20">Contraseña</label>
                                <div class="relative w-full">
                                    <div class="absolute inset-y-0 right-0 flex items-center px-2">
                                      <label (click)="seePassword(true)"   class=" cursor-pointer" for="toggle"><i class="bi bi-eye-fill text-gray-500 "></i></label>
                                    </div>
                                    <input formControlName="clave"  class="inputGeneral js-password" id="password" type="password" autocomplete="off" placeholder="Ingresa tu nombre de contraseña"/>
                                </div>
                            </div>  
                        }@else{
                            <div class="">
                                <label for="password" class="labelGeneral z-20">Contraseña</label>
                                <div class="relative w-full">
                                    <div class="absolute inset-y-0 right-0 flex items-center px-2">
                                      <label (click)="seePassword(false)" class=" cursor-pointer" for="toggle"><i class="bi bi-eye-slash-fill text-gray-500 "></i></label>
                                    </div>
                                    <input formControlName="clave" formControlName="clave"  class="inputGeneral js-password" id="password" type="text" autocomplete="off"
                                    />
                                </div>
                             </div>
                        }
                        <div class="flex justify-center pb-2 pt-3">
                            <button type="button" 
                            [disabled]="formUser.invalid"  
                            (click)="loginSystemUser(formUser.value)"           
                            class=" bg-[#ea7e33] text-white text-md py-2.5 px-7 rounded-full     ease disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-700 ">
                            Verificar</button>
                        </div>
                        <hr>
                        <div class="text-xs font-medium text-gray-500 dark:text-gray-300 flex justify-center pt-2 pb-5 cursor-pointer" (click)="changeForm('registrar')">
                            ¿No tienes cuenta? <a  class="text-gray-900 hover:underline pl-1 font-semibold "> Regístrate ahora.</a>
                        </div>
                    </form>
                } @else{
                    <form class="space-y-4 px-3" [formGroup]="formAdmin" >
                
                        <div class="pb-2">
                            <label for="email" class="labelGeneral">Usuario</label>
                            <input 
                            formControlName="usuario"  type="text" class="inputGeneral" placeholder="Ingrese cédula o RUC" required />
                        </div>
                        @if(!flagPassword){
                            <div>
                                <label for="password" class="labelGeneral z-20">Contraseña</label>
                                <div class="relative w-full">
                                    <div class="absolute inset-y-0 right-0 flex items-center px-2">
                                      <label (click)="seePassword(true)"   class=" cursor-pointer" for="toggle"><i class="bi bi-eye-fill text-gray-500 "></i></label>
                                    </div>
                                    <input formControlName="clave"  class="inputGeneral js-password" id="password" type="password" autocomplete="off" placeholder="Ingresa tu nombre de contraseña"/>
                                </div>
                            </div>  
                        }@else{
                            <div class="">
                                <label for="password" class="labelGeneral z-20">Contraseña</label>
                                <div class="relative w-full">
                                    <div class="absolute inset-y-0 right-0 flex items-center px-2">
                                      <label (click)="seePassword(false)" class=" cursor-pointer" for="toggle"><i class="bi bi-eye-slash-fill text-gray-500 "></i></label>
                                    </div>
                                    <input formControlName="clave" formControlName="clave"  class="inputGeneral js-password" id="password" type="text" autocomplete="off"
                                    />
                                </div>
                             </div>
                        }
        
                        <div class="flex justify-end"  >
                            <a   class="text-xs text-black hover:underline dark:text-blue-500">¿Olvidaste tu contraseña?</a>
                        </div>
                        <div class="flex justify-center pb-2 pt-3">
                            <button type="button" 
                            [disabled]="formAdmin.invalid"  
                            (click)="loginSystem(formAdmin.value)"           
                            class=" bg-[#ea7e33] text-white text-md py-2.5 px-7 rounded-full   ease disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-700 ">
                            Iniciar Sesión</button>
                        </div>
                        <hr>
    
                    </form>  
                }
    
            </div>
        }@else{
            <div class="p-4 md:p-5">
    
                    <form class="space-y-4 px-3" [formGroup]="formRegister" >
                
                        <div class="pb-2">
                            <label for="email" class="labelGeneral">Cédula o RUC</label>
                            <input 
                            formControlName="cedula" type="text" class="inputGeneral" placeholder="Ingrese cédula o RUC" required />
                        </div>
                        <div class="pb-2">
                            <label for="email" class="labelGeneral">Nombres</label>
                            <input 
                            formControlName="nombres" type="text" class="inputGeneral" placeholder="Ingrese cédula o RUC" required />
                        </div>
                        <div class="pb-2">
                            <label for="email" class="labelGeneral">Apellidos</label>
                            <input 
                            formControlName="apellidos" type="text" class="inputGeneral" placeholder="Ingrese cédula o RUC" required />
                        </div>
                        <div class="pb-2">
                            <label for="email" class="labelGeneral">Correo</label>
                            <input 
                            formControlName="email" type="text" class="inputGeneral" placeholder="Ingrese cédula o RUC" required />
                        </div>

                        <div class="flex justify-center pb-2 pt-3">
                            <button type="button" 
                            [disabled]="formRegister.invalid" 
                            (click)="registerUser(formRegister.value)"             
                            class=" bg-[#ea7e33] text-white text-md py-2.5 px-7 rounded-full     ease disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-700 ">
                            Registrarse
                        </button>
                        </div>
                        <hr>
                        <div class="text-xs font-medium text-gray-500 dark:text-gray-300 flex justify-center pt-2 pb-5 cursor-pointer" (click)="changeForm('login')">
                             <a  class="text-gray-900 hover:underline pl-1 font-semibold "> Regresar</a>
                        </div>
                    </form>

            </div>
        }

    </div>


    <!-- <app-spinner  class="z-50" [flagLoader]="flagLoader"></app-spinner> -->
