<div class="card rounded-xl shadow-lg   !h-[6.75rem] " style="border: 1px solid rgb(228, 228, 228);">
    <div class="grid grid-cols-8 h-full w-full">
        <div class="col-span-3 flex items-center justify-center overflow-hidden">
            @if(d?.imagenPrincipal === '1bW4FHKxVF0tHzYbiYTu1iEh4BaSYbRm2') {
            <img [loading]="isLazyLoaded ? 'lazy' : 'eager'" [decoding]="isLazyLoaded ? 'async' : 'auto'"
                class="object-scale-down w-full h-full md:rounded-none md:rounded-s-xl shadow-2xl "
                [src]="urlFirebae + logo + '?alt=media'" [alt]="d?.pro_nom || 'Producto'" [srcset]="generateSrcSet()"
                [sizes]="getSizes()" (load)="onImageLoad($event)" (error)="onImageError($event)" />
            } @else {
            <img [loading]="isLazyLoaded ? 'lazy' : 'eager'" [decoding]="isLazyLoaded ? 'async' : 'auto'"
                class="object-cover w-full h-full md:rounded-none md:rounded-s-xl shadow-2xl p-[1px]" [src]="optimizedImageSrc"
                [alt]="d?.pro_nom || 'Producto'" [srcset]="generateSrcSet()" [sizes]="getSizes()"
                (load)="onImageLoad($event)" (error)="onImageError($event)" />
            }
            @if (!imageLoadedState && !imageErrorState && isLazyLoaded) {
            <div class="absolute inset-0 bg-gray-100 flex items-center justify-center">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-orange-400"></div>
            </div>
            }
        </div>
        <div class="col-span-5">
            <div class="flex flex-col pt-3 justify-between px-3 leading-normal  w-full">
                <p class="text-xs font-normal tracking-tight text-gray-500 line-clamp-3 hover:text-gray-700 transition-colors"
                    [title]="d?.pro_nom">
                    {{ d?.pro_nom }}
                </p>
                <div class="mt-2">
                    <p
                        class="text-sm font-bold tracking-tight text-gray-500 line-clamp-3 hover:text-gray-700 transition-colors">
                        $ {{ d.precioReal | number:'1.2-2' }}
                    </p>
                </div>
                <div class="flex justify-between  w-full ">
                    <div class="flex items-center">
                        <button type="button" onclick="decrementQuantity('product-1')"
                            class="flex items-center justify-center w-6 h-6 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-full hover:bg-gray-100 hover:text-gray-700 focus:ring-4 focus:ring-gray-200 transition-colors">
                            <i class="fas fa-minus text-xs"></i>
                        </button>

                        <input type="number" id="quantity-product-1" [value]="d.quantity" min="1" max="99"
                            class="mx-2 w-12 text-center text-sm font-medium text-gray-900 bg-transparent border-0 focus:ring-0 focus:outline-none"
                            readonly>

                        <button type="button" onclick="incrementQuantity('product-1')"
                            class="flex items-center justify-center w-6 h-6 text-sm font-medium text-white bg-red-500 border rounded-full hover:bg-red-600 focus:ring-4 focus:ring-red-200 transition-colors">
                            <i class="fas fa-plus text-xs"></i>
                        </button>
                    </div>

                    <div class="flex  ">
                        <button type="button" onclick="removeProduct('product-1')"
                            class="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-full transition-colors "
                            title="Eliminar producto">
                            <i class="far fa-trash-alt text-lg"></i>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <style>
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .5;
            }
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .line-clamp-4 {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Mantener tus clases CSS existentes */
        .imgCardPS {
            /* Mantener tus estilos existentes */
        }

        .imgLogo {
            /* Mantener tus estilos existentes */
        }

        .spanColor {
            /* Mantener tus estilos existentes */
        }

        /* Mejoras de accesibilidad */
        .group:focus-within .opacity-0 {
            opacity: 1;
        }

        /* Optimizaciones de rendimiento */
        .card-mobile {
            contain: layout style paint;
        }

        .card-desktop {
            contain: layout style paint;
        }

        /* Animaciones suaves */
        .transition-all {
            transition: all 0.2s ease-in-out;
        }

        .transition-transform {
            transition: transform 0.3s ease-in-out;
        }

        .transition-shadow {
            transition: box-shadow 0.3s ease-in-out;
        }

        .transition-colors {
            transition: color 0.2s ease-in-out, background-color 0.2s ease-in-out;
        }

        /* Hover effects */
        .hover\:scale-105:hover {
            transform: scale(1.05);
        }

        .hover\:scale-110:hover {
            transform: scale(1.10);
        }

        .active\:scale-95:active {
            transform: scale(0.95);
        }

        /* Estados de carga */
        .animate-spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .card-mobile .p-4 {
                padding: 0.75rem;
            }

            .card-mobile .text-lg {
                font-size: 1rem;
            }
        }

        /* Optimización para pantallas de alta densidad */
        @media (-webkit-min-device-pixel-ratio: 2),
        (min-resolution: 192dpi) {

            .imgCardPS,
            .imgLogo {
                image-rendering: -webkit-optimize-contrast;
                image-rendering: crisp-edges;
            }
        }
    </style>
