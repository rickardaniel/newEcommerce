<!-- <nav class="bg-[#f2f2f4] m-2 rounded-2xl shadow-md border-gray-200 dark:bg-gray-900 "> -->
<nav class="bg-[#f2f2f4] my-2 rounded-2xl shadow-md border-gray-200 fixed w-full z-30 ">
  <!-- <div class="max-w-screen-xl flex  flex-wrap  items-center justify-around mx-10 p-3"> -->
  <div class=" flex   flex-wrap  items-center justify-around  p-1">
    <a href="https://flowbite.com/" class="flex items-center space-x-3 rtl:space-x-reverse">
      <img [src]="urlBase+configuracion?.imgLogo+'?alt=media'" class="h-14" alt="Flowbite Logo" />
    </a>

    <div class="flex md:order-2">
      <button type="button" data-collapse-toggle="navbar-search" aria-controls="navbar-search" aria-expanded="false"
        class="md:hidden text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-lg text-sm p-2.5 me-1">
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
        </svg>
        <span class="sr-only">Search</span>
      </button>
      <div class="relative hidden md:block">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
          <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
            fill="none" viewBox="0 0 20 20">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
          </svg>
          <span class="sr-only">Search icon</span>
        </div>
        <input type="text" id="search-navbar"
          class="block w-full p-2 rounded-full  2xl:mr-40 xl:mr-30 lg:mr-10 mr-1 border-0 shadow-md  ps-10 text-sm text-gray-900 border border-gray-300  bg-white focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
          placeholder="¿Qué está buscando?">
      </div>
    </div>
    <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-search">
      <div class="relative mt-3 md:hidden">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
          <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
            fill="none" viewBox="0 0 20 20">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
          </svg>
        </div>
        <input type="text" id="search-navbar2"
          class="block w-full p-2 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
          placeholder="Search...">
      </div>
      <ul
        class="flex flex-col p-4 md:p-0 mt-4 font-medium  border border-gray-100 rounded-lg bg-[#f2f2f4] md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-[#f2f2f4] dark:bg-gray-800 md:dark:bg-gray-900 dark:border-gray-700">
        <li>
          <a [routerLink]="['/']" routerLinkActive="router-link-active" (click)="eraseRoute()"
            class="block py-2 px-3 text-gray-900 rounded    hoverMenu " aria-current="page">Sobre Nosotros</a>
        </li>
        <li>
          <a [routerLink]="['/ecommerce']" routerLinkActive="router-link-active" (click)="eraseRoute()"
            class="block py-2 px-3 text-gray-900 rounded    hoverMenu">E-commerce</a>
        </li>
        <li>
          <a [routerLink]="['/products']" routerLinkActive="router-link-active"
            class="block py-2 px-3 text-gray-900 rounded    hoverMenu">Catálogo</a>
        </li>
      </ul>
    </div>
    <div class="flex items-center md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse  ">

      <div class="grid grid-cols-2 divide-x space-x-3 divide-gray-800">
        @if(!clientLogin.login){
        <div class="col-span-1 pt-3">
          <span (click)="openModal('#modalLogin')" class=" text-sm mt-2 px-3 py-1.5 initSesion   ">Iniciar
            Sesión</span>
        </div>
        }@else{
        <button
          class="relative group transition-all duration-200 focus:overflow-visible  rounded-full  py-3.5 overflow-hidden flex flex-row items-center justify-center  gap-2  border border-zinc-200 btnAvatar">
          <span class="text-sm  spanAvatar">
            {{getInitials(clientLogin.name) | uppercase }}
          </span>
          <div
            class="z-50 absolute shadow-lg -bottom-28 left-0  h-max p-2 bg-white text-gray-600 border border-zinc-200 rounded-lg flex flex-col gap-2"
            style="width: 11.5em;">
            <span class="flex flex-row gap-2 items-center hover:bg-zinc-100 p-2 rounded-lg" (click)="goClientProfile()">
              <i class="bi bi-person-circle"></i>
              <p>Mi cuenta</p>
            </span>
            <span class="flex flex-row gap-2 items-center hover:bg-zinc-100 p-2 rounded-lg" (click)="signOff()">
              <i class="bi bi-box-arrow-right"></i>
              <p>Cerrar Sesión</p>
            </span>
          </div>
        </button>
        }

        <div class="col-span-1  ">
          <button (click)="toggleDrawer()" class=" text-white rounded-full mt-3 px-1 ml-4 btnCar"
            style="  padding: 3px 4px;">
            <i class="bi bi-cart-plus-fill"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>


<!-- OPEN MODAL LOGIN SYSTEM -->

<div id="modalLogin" tabindex="-1" aria-hidden="true"
  class="hidden overflow-y-auto overflow-x-hidden fixed top-0 
            right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full   animate__animated animate__slideInRight ">
  <div class="relative p-4 w-full max-w-sm max-h-full">
    <!-- <app-login-component (loginCliente)="updateLoginScreen($event)" [origin]="'cotizacion'"></app-login-component> -->
    <app-login-register [configuracion]="configuracion" [information]="information"></app-login-register>
  </div>
</div>

<div
  class="fixed top-0 right-0 h-screen 2xl:w-[23rem] xl:w-[21em]  overflow-y-auto     bg-white dark:bg-gray-800 shadow-lg z-50 transform transition-transform duration-300 ease-in-out rounded-t-2xl shadow-xl "
  [ngClass]="{
      'translate-x-0': isDrawerOpen,
      'translate-x-full': !isDrawerOpen
    }">
  <div class="flex justify-between items-center p-4 border-b dark:border-gray-700">
    <h2 class="text-xl font-semibold text-gray-600 dark:text-white">Tu carrito de compras</h2>
    <button (click)="closeDrawer()" type="button"
      class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
      <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
      </svg>
      <span class="sr-only">Cerrar modal</span>
    </button>
  </div>
  @if(flagLoader){
  <ng-container>

    <div role="status"
      class="max-w-sm p-4 border border-gray-200 rounded-sm shadow-sm animate-pulse md:p-6 dark:border-gray-700">
      <div class="flex items-center justify-center h-48 mb-4 bg-gray-300 rounded-sm dark:bg-gray-700">
        <svg class="w-10 h-10 text-gray-200 dark:text-gray-600" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
          fill="currentColor" viewBox="0 0 16 20">
          <path
            d="M14.066 0H7v5a2 2 0 0 1-2 2H0v11a1.97 1.97 0 0 0 1.934 2h12.132A1.97 1.97 0 0 0 16 18V2a1.97 1.97 0 0 0-1.934-2ZM10.5 6a1.5 1.5 0 1 1 0 2.999A1.5 1.5 0 0 1 10.5 6Zm2.221 10.515a1 1 0 0 1-.858.485h-8a1 1 0 0 1-.9-1.43L5.6 10.039a.978.978 0 0 1 .936-.57 1 1 0 0 1 .9.632l1.181 2.981.541-1a.945.945 0 0 1 .883-.522 1 1 0 0 1 .879.529l1.832 3.438a1 1 0 0 1-.031.988Z" />
          <path d="M5 5V.13a2.96 2.96 0 0 0-1.293.749L.879 3.707A2.98 2.98 0 0 0 .13 5H5Z" />
        </svg>
      </div>
      <div class="h-2.5 bg-gray-200 rounded-full dark:bg-gray-700 w-48 mb-4"></div>
      <div class="h-2 bg-gray-200 rounded-full dark:bg-gray-700 mb-2.5"></div>
      <div class="h-2 bg-gray-200 rounded-full dark:bg-gray-700 mb-2.5"></div>
      <div class="h-2 bg-gray-200 rounded-full dark:bg-gray-700"></div>
      <div class="flex items-center mt-4">
        <svg class="w-10 h-10 me-3 text-gray-200 dark:text-gray-700" aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
          <path
            d="M10 0a10 10 0 1 0 10 10A10.011 10.011 0 0 0 10 0Zm0 5a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm0 13a8.949 8.949 0 0 1-4.951-1.488A3.987 3.987 0 0 1 9 13h2a3.987 3.987 0 0 1 3.951 3.512A8.949 8.949 0 0 1 10 18Z" />
        </svg>
        <div>
          <div class="h-2.5 bg-gray-200 rounded-full dark:bg-gray-700 w-32 mb-2"></div>
          <div class="w-48 h-2 bg-gray-200 rounded-full dark:bg-gray-700"></div>
        </div>
      </div>
      <span class="sr-only">Loading...</span>
    </div>

    <div class="flex items-center justify-center mt-3 ">
      <button disabled type="button"
        class="text-gray-500 bg-gray-50  focus:ring-4 focus:ring-blue-300 font-semibold rounded-lg text-md px-5 py-2.5 text-center me-2 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800 inline-flex items-center">
        <svg aria-hidden="true" role="status" class="inline w-4 h-4 me-3 text-gray-500 animate-spin"
          viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
            fill="#E5E7EB" />
          <path
            d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
            fill="currentColor" />
        </svg>
        Cargando...
      </button>
    </div>




  </ng-container>

  }@else {
  <ng-container>
    <div class="grid-cols-1 p-2 space-y-2  ">
      @for(prod of arrayProduct; track prod){
      <div class="col-span-1  ">
        <app-sidebar-layout-rigth [prod]="prod" [logo]="logo" [isLazyLoaded]="true" (updateCarAddQuit)="callQuitProduct($event)"
          [loading]="true" (updateCar)="updateCarNow($event)" (addOrQuitProduct)="callQuitProduct($event)" ></app-sidebar-layout-rigth>
      </div>
      }
    </div>
    <hr>

    <div class="block justify-center items-center p-4 border-b dark:border-gray-700  bg-gray-100 ">

      <div class="flex justify-between items-center mb-4">
        <span class="text-lg font-medium text-gray-700">Subtotal:</span>
        <span class="text-lg font-bold text-red-500" id="cart-subtotal">$ {{subTotal(arrayProduct) |
          number:'1.2-2'}}</span>
      </div>

      <button type="button" (click)="goToCheckout()"
        class="w-full bg-red-500 text-white py-1.5 px-4 shadow-lg rounded-full font-medium text-md hover:bg-red-600 focus:ring-4 focus:ring-red-200 transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98]">
        Ir al carrito
      </button>
    </div>

    

  </ng-container>
  }





</div>
