<div class="w-full font-montserrat">
    <!-- HEADER -->
    <div class="fixed w-full z-10 flex bg-gray-200 p-2 items-center justify-center h-14 px-10 shadow-md">
        <div class="logo ml-12 font-bold transform ease-in-out duration-500 text-blue-800 flex-none h-full flex items-center justify-center">
            <img [src]="urlB+configuracion?.imgLogo+'?alt=media'" class="h-9" alt="Logo">
        </div>
        <!-- SPACER -->
        <div class="grow h-full flex items-center justify-center"></div>
        <div class="flex-none h-full text-center flex items-center justify-center">
            <span class="pt-5 text-sm font-bold cursor-pointer" (click)="redirecto()">
                {{information?.nombre | uppercase}} 
                <i class="ml-5 bi bi-house-fill text-xl transition transform hover:scale-110  text-white rounded-full shadow-lg px-2 py-1.5 iconHome"></i>
            </span> 
        </div>
    </div>

    <!------------------- SIDEBAR --------------------->
    <aside class="w-60 -translate-x-48 fixed transition transform ease-in-out duration-1000 z-10 flex h-screen shadow-lg classSidebar">
        
        <!-- Open sidebar button -->
        <div class="max-toolbar translate-x-24 scale-x-0 w-full -right-6 transition transform ease-in duration-300 flex items-center justify-between bg-blue-100 absolute top-2 rounded-full h-12">
            <div class="flex pl-4 items-center space-x-2"></div>
            <div class="flex items-center space-x-3 group bg-gradient-to-r classSuper pl-10 pr-2 py-1 rounded-full">
                <div class="transform ease-in-out duration-300 mr-12">
                    <h1 class="title text-xl font-medium">Web-Shop</h1> 
                </div>
            </div>
        </div>

        <!-- Toggle button -->
        <div (click)="openNav()" 
             class="-right-6 transition transform ease-in-out duration-500 flex border-4 border-white bg-gray-500 hover:bg-gray-700 absolute top-2 p-3 rounded-full text-white hover:rotate-45 cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={3} stroke="currentColor" class="w-4 h-4">
                <path strokeLinecap="round" strokeLinejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
            </svg>
        </div>

        <!-- MAX SIDEBAR (Expandido) -->
        <nav class="max hidden px-5 mt-16 2xl:mt-20 flex-col space-y-2 w-full h-screen overflow-y-auto classActiveN">
            @for(item of menuItems; track $index) {
                <a [routerLink]="item.path"
                   routerLinkActive="font-bold rounded-lg classActive"
                   class="w-full px-3 py-2 2xl:py-2 xl:py-1.5 2xl:text-sm xl:text-xs transform ease-in-out duration-100 flex items-center space-x-3 hover:bg-gray-100 rounded-lg transition-colors">
                    <i [class]="item.data?.['icon']" class="flex-shrink-0"></i>
                    <span class="truncate">{{item.title}}</span>
                </a>
            }
        </nav>

        <!-- MINI SIDEBAR (Recogido) - AQUÍ ESTÁ LA CORRECCIÓN PRINCIPAL -->
        <nav class="mini mt-14 2xl:mt-20 flex flex-col space-y-2 w-full h-screen overflow-y-auto classActiveN pb-4">
            @for(item of menuItems; track $index) {
                <a [routerLink]="item.path"
                   routerLinkActive="bg-white border-l-4  classActive"
                   class="group w-full flex items-center justify-end pr-5 py-3 pl-56 hover:bg-gray-50 hover:shadow-sm transition-all duration-300 ease-in-out border-l-4 border-transparent"
                   [title]="item.title">
                    
                    <div class="flex items-center justify-center w-10 h-8 transition-all duration-300 ease-in-out group-hover:ml-2 group-hover:scale-110">
                        <i [class]="item.data?.['icon2']" 
                           class="text-lg  group-hover:text-blue-500 transition-colors duration-300"></i>
                    </div>
                </a>
            }
        </nav>
    </aside>

    <!-- CONTENT -->
    <main class="content ml-12 ease-in-out duration-500 pt-14 px-1 md:px-5 pb-4 bg-white min-h-screen">
        <router-outlet></router-outlet>
    </main>
</div>

<!-- Modal de sesión -->
<div id="modalSesion" tabindex="-1" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative p-4 w-full max-w-md max-h-full">
        <div class="relative bg-white rounded-lg shadow-lg">
            <div class="p-4 md:p-5 text-center">
                <svg class="mx-auto mb-4 text-gray-400 w-12 h-12" fill="none" viewBox="0 0 20 20">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 11V6m0 8h.01M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
                <h3 class="mb-5 text-lg font-normal text-gray-500">¿Está seguro de cerrar sesión?</h3>
                
                <div class="flex justify-center space-x-3">
                    <button type="button" 
                            (click)="closeModal(false, '#modalSesion')"
                            class="text-gray-500 bg-white hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-200 rounded-lg border border-gray-200 text-sm font-medium px-5 py-2.5 transition-colors">
                        No por ahora
                    </button>
                    <button type="button" 
                            (click)="closeModal(true, '#modalSesion')"
                            class="text-white bg-green-500 hover:bg-green-600 focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2.5 transition-colors">
                        Sí, cerrar 
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.font-montserrat {
    font-family: 'Montserrat', sans-serif;
}

/* Estilos para el scrollbar personalizado (opcional) */
.overflow-y-auto::-webkit-scrollbar {
    width: 4px;
}

.overflow-y-auto::-webkit-scrollbar-track {
    background: transparent;
}

.overflow-y-auto::-webkit-scrollbar-thumb {
    background: #cbd5e0;
    border-radius: 2px;
}

.overflow-y-auto::-webkit-scrollbar-thumb:hover {
    background: #a0aec0;
}

.classActive{
    background-color: white !important;
    color: var(--dynamic-color);
    font-weight: 600 !important;
    /* @apply hover:bg-white; */

}

</style>
