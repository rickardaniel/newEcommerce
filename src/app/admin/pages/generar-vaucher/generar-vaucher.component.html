<div class="mx-1 text-sm my-5 animate__animated animate__fadeIn">
                <h2 class="mb-2 2xl:text-2xl text-xl font-bold text-gray-600 pb-5">Generar Vaucher </h2>

    <div class="w-full">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 border border-gray-200 rounded-md  shadow-md  mt-2 p-4 bg-gray-100">

            <!-- Columna izquierda - Formulario -->
            <div class="space-y-4">
                <!-- Campo Valor -->
                <div>
                    <label for="valor" class="labelGeneral3">
                        Valor
                    </label>
                    <input type="text" id="valor" class="inputGeneral3" placeholder="Ingrese el valor del voucher"
                        [(ngModel)]="vaucher.valor_transaccion">
                </div>

                <!-- Campo Descripción -->
                <div>
                    <label for="descripcion" class="labelGeneral3">
                        Descripción
                    </label>
                    <input type="text" id="descripcion" class="inputGeneral3" placeholder="Detalle del voucher"
                        [(ngModel)]="vaucher.detalle_transaccion">
                </div>

                <!-- Botón Generar -->
                <div class="flex justify-center mt-6">
                    <button type="button"
                        class="text-white bg-green-500 hover:bg-green-800 focus:ring-4 focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2.5 focus:outline-none inline-flex items-center gap-2"
                        (click)="generateVaucher()">
                        Generar
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                                d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z"
                                clip-rule="evenodd"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Columna derecha - QR Code -->
            <div class="flex flex-col items-center justify-center space-y-3" *ngIf="myAngularxQrCode">
                <!-- QR Code -->
                <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                    <qrcode [qrdata]="myAngularxQrCode" [width]="256" [errorCorrectionLevel]="'M'"></qrcode>
                </div>

                <!-- Botón Abrir enlace -->
                <button type="button"
                    class="text-white bg-yellow-400 hover:bg-yellow-500 focus:ring-4 focus:ring-yellow-300 font-medium rounded-lg text-sm px-4 py-2 focus:outline-none inline-flex items-center gap-2"
                    (click)="openLik()">
                    <span class="text-sm">Abrir enlace</span>
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                        <path
                            d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z">
                        </path>
                        <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-1a1 1 0 10-2 0v1H5V7h1a1 1 0 000-2H5z">
                        </path>
                    </svg>
                </button>

                <!-- Botón Compartir WhatsApp -->
                <button type="button"
                    class="text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:ring-green-300 font-medium rounded-lg text-sm px-4 py-2 focus:outline-none inline-flex items-center gap-2"
                    (click)="sharedWhatsapp()">
                    <span class="text-sm">Compartir enlace</span>
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z"
                            clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Loading  -->
<ngx-loading [show]="loading" [config]="{ backdropBorderRadius: '3px', fullScreenBackdrop: true }" [template]="">
</ngx-loading>
