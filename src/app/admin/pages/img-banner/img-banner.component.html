<div class=" pt-5">
    <h2 class="mb-2 2xl:text-2xl text-xl font-bold text-gray-600 ">Imágenes Banner </h2>
    <div class="2xl:mx-10 xl:mx-1 mt-3">
        <div
        class="mt-5   grid grid-cols-6    2xl:space-x-3 xl:space-x-2 lg:space-x-1 md:space-y-1 md:space-x-1 space-y-1  relative">
        <div class="col-span-6">
            <button (click)="openModal('#modalUpload')"
                class="bg-green-400 text-white px-5 py-1.5 rounded-md text-xs  effectoZoomBoton">
                Subir Banner <i class="bi bi-plus"></i>
            </button>
        </div>

    </div>
    
    <div class="relative overflow-x-auto shadow-md sm:rounded-lg mt-5 ">
        <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400 p-2">
            <thead
                class="text-xs text-gray-200 uppercase bg-gray-500  dark:bg-gray-700 dark:text-gray-400 text-center">
                <tr>
                    <th scope="col" class="px-6 py-2">
                        id
                    </th>
                    <th scope="col" class="px-6 py-2">
                        Nombre
                    </th>
                    <th scope="col" class="px-6 py-2">
                        Imágen
                    </th>

                    <th scope="col" class="px-6 py-2 text-center">
                        <i class="bi bi-gear-fill"></i>
                    </th>
                </tr>
            </thead>
            <tbody>

                @if(imagesBanner.length==0){
                <tr>
                    <td colspan="6">
                        <div class=" flex justify-center pt-5">
                            <i class="bi bi-image text-6xl text-gray-500 "></i>
                        </div>
                        <div class=" flex justify-center pb-5">

                            <span style="font-size: 20px; ;" class="text-gray-500"> Aún no ha cargado
                                banners </span>
                        </div>
                    </td>
                </tr>
                }@else {
                @for(b of imagesBanner; track b.id){
                <tr
                    class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 text-xs text-center">
                    <th scope="row" class="px-6 py-2 font-semibold text-gray-900 whitespace-nowrap dark:text-white">
                        {{b.id_img_banner}}
                    </th>

                    <td class="px-6 py-2">
                        {{b.url}}
                    </td>
                    <td class="px-6 py-2 flex justify-center ">
                        <img [src]="urlBase+b.url+'?alt=media'" alt="" width="100"  class="cursor-pointer  rounded-md shadow-md "  title='VER EN GRANDE' (click)="redirecTo(urlBase+b.url+'?alt=media')" >
                    </td>


                    <td class="px-6 py-2 text-center">
                        <i 
                        (click)="deleteBanner(b)"
                            class="bi bi-trash2-fill text-red-500 2xl:text-sm py-1.5 px-2 hover:py-1.5 hover:px-2 hover:bg-red-500 hover:rounded-full hover:text-white cursor-pointer"></i>
                    </td>
                </tr>
                }
                }
            </tbody>
        </table>
    </div>
    </div>
</div>


<!-- MODAL UPLOAD LOGO -->

<div id="modalUpload" tabindex="-1"
class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative p-4 w-full max-w-md max-h-full">
    <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
        <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">

        <h3 class=" text-lg font-normal text-gray-500 dark:text-gray-400">Seleccionar imagen banner</h3>
        <button type="button" class="end-2.5 white bg-gray-200 icoClose rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center " (click)="closeModal(true, '#modalUpload')">
            <svg class="w-3 h-3 " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
            </svg>
            <span class="sr-only">Close modal</span>
        </button>
    </div>

        <div class="p-4 md:p-5 text-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-image mx-auto mb-4 text-gray-400" viewBox="0 0 16 16">
                <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
                <path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1z"/>
            </svg>
            <input (change)="onSelectAnyImage($event)"  class="block w-full mb-5 text-xs text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400" id="small_size" type="file">        
        </div>

        <div  class="flex justify-center pb-4"  >
            <button  class="bg-green-400 text-white px-5 py-2 rounded-md text-xs  ease disabled:cursor-not-allowed disabled:bg-gray-400  "
            (click)="uploadImage()"
            [disabled]="!flagfileImg" >
                Subir Banner <i class="bi bi-cloud-plus-fill"></i>
            </button>
        </div>
    </div>
    </div>
</div>

<!-- Loading  -->
<ngx-loading [show]="loading" [config]="{ backdropBorderRadius: '3px', fullScreenBackdrop: true }" [template]="">
</ngx-loading>
