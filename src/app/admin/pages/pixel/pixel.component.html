<div class="container mt-5">
        <div class="grid grid-cols-1 border rounded mt-2 ml-0 mr-0 bg-light">
          <div class="col-span-1 bg-[#3B5998] text-white text-size-13 text-center m-3 p-2 rounded-md shadow-md ">
            <label class="col-form-label btn-facebook w-100 text-sm "> <strong class="text-size-13">Inserte su código fuente
                otorgado por pixel de facebook, para ser implementado en su tienda</strong></label>
          </div>
          <div class="col-span-1 text-size-13 text-center m-3 p-2  ">
            <textarea style="font-size: 13px;width: 100% ; " rows="20" class="inputGeneral3" 
              [(ngModel)]="configuracion.pixel_facebook"></textarea>
          </div>
          <div class=" text-center mt-2 mb-2">
            <button class="bg-green-500 px-7 py-2 text-white text-xs rounded-md shadow-sm   " (click)="updatePixelfacebook(configuracion.pixel_facebook)">
              Guardar
            </button>
          </div>
        </div>
</div>
