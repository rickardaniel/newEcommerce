<div class=" pt-5">
    <h2 class="mb-2 2xl:text-2xl text-xl font-bold text-gray-600">Misión, Visión, Valores </h2>
    <form [formGroup]="formMisionVision" >
    <div
        class="mt-5 relative   grid grid-cols-10  2xl:mx-5   2xl:space-x-3 xl:space-x-2 lg:space-x-1 md:space-y-1 md:space-x-1 space-y-1   bg-gray-200  p-5  rounded-md">
      
        <div class="col-span-6">
            <div class="grid grid-cols-3 space-x-2 ">
                <div class="col-span-2">
                    <div class="card bg-white p-2 rounded-md">
                        <span>Misión</span>
                        <textarea name="" id="" rows="14" class="inputGeneral2"
                            formControlName="mision"
                            placeholder="Ingrese Misión de la empresa"></textarea>
                    </div> 
                </div>
                <div class="col-span-1">
                    <div class="flex justify-center  relative mt-4 ">
                        @if(information.imagenMision){
                            <img class="img-info mt-1  "
                            [src]="urlBase+information.imagenMision+'?alt=media'" style="border-radius: 8px; height: 300px; width: 85%;">
                            <button 
                                (click)="openModal('#modalUpload')"
                                class=" bg-gray-600 text-white px-2 py-1 rounded-md absolute top-0 right-5 shadow-lg text-xs ">
                                Cambiar <i class="bi bi-images"></i>
                            </button>
                        }@else{
                            <img class="img-info mt-1 w-75" 
                            src="../../../../assets/img/iconos-mision-01.png">
                        }
                    </div>
                </div>
            </div>


        </div>
        <div class="col-span-4">
            <div class="grid-cols-1 space-y-2">
                <div class="col-span-1">
                    <div class="card bg-white p-2 rounded-md ">
                        <span>Visión</span>
                        <textarea name="" id="" rows="5" class="inputGeneral2"
                            formControlName="vision"
                            placeholder="Ingrese Visión de la empresa"></textarea>
                    </div>
                </div>
                <div class="col-span-1">
                    <div class="card bg-white p-2 rounded-md">
                        <span>Valores </span>
                        <textarea name="" id="" rows="5" class="inputGeneral2 text-xs"
                            formControlName="valores"
                            placeholder="Ingrese valores de la empresa"></textarea>
                    </div>
                </div>
            </div>

        </div>

        <div class="absolute top-0 right-0">
            <div class="flex justify-center">
                <button
                    (click)="updateAboutUs(formMisionVision.value)" 
                    class="bg-gray-400  hover:bg-gray-700 hover:text-white  px-3 py-2.5 rounded-full text-xs mt-4 shadow-lg hover:shadow-2xl transition transform hover:-translate-y-1 motion-reduce:transition-none motion-reduce:hover:transform-none">
                    <i class="bi bi-pencil-fill"></i>
                </button>
            </div>
        </div>
  
    </div>
</form>
</div>

<div id="modalUpload" tabindex="-1"
class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
<div class="relative p-4 w-full max-w-md max-h-full">
  <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
    <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">

      <h3 class=" text-lg font-normal text-gray-500 dark:text-gray-400">Seleccionar imagen</h3>
      <button type="button" class="end-2.5 white bg-gray-200 icoClose rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center " (click)="closeModal(true, '#modalUpload')">
          <svg class="w-3 h-3 " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
          </svg>
          <span class="sr-only">Close modal</span>
      </button>
  </div>

      <div class="p-4 md:p-5 text-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-image mx-auto mb-4 text-gray-400" viewBox="0 0 16 16">
            <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
            <path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1z"/>
          </svg>
          <input (change)="onSelectAnyImage($event)"  class="block w-full mb-5 text-xs text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400" id="small_size" type="file">        
      </div>
  </div>
</div>
</div>
